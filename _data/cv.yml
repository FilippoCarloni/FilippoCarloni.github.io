- title: Experience
  type: time_table
  contents:
    - title: Postdoctoral Researcher
      institution: National Inter-University Consortium for Telecommunications (CNIT), Italy
      year: Mar 2025 - present
      description:
        - 'Member of the <a href="https://antlab.deib.polimi.it/research-activities/networks-and-systems/">Networks and Systems group</a> at ANTLab, Politecnico di Milano, supervised by <a href="https://gianniantichi.github.io/">Prof. Gianni Antichi</a>.'
        - Research and development of network systems frameworks, including domain-specific compilers and customized offloading techniques exploiting hardware acceleration on FPGA- and ASIC-based SmartNICs.
        - Focus on network security applications such as DDoS mitigation, firewalling, and real-time traffic monitoring.
        - System design, implementation, and experimental evaluation on cutting-edge platforms (e.g., NVIDIA BlueField-3 DPU).
    - title: Visiting Student
      institution: Massachusetts Institute of Technology (MIT), Boston (MA), USA
      year: Apr 2024 - Sep 2024
      description:
        - Visiting Ph.D. student in the COMMIT group led by Prof. Saman Amarasinghe.
        - Low-latency, high-throughput SmartNIC processing logic supporting custom protocols generated by the NetBlocks framework, on open-source platforms such as AMD OpenNIC.
    - title: Teaching Assistant
      institution: Politecnico di Milano, Milano, Italy
      year: Feb 2022 - present
      description:
        - Computer Architecture and Operating Systems (085779) - Teaching Assistant, 40h/year (Sept 2022 - present)
        - Computer Science and Elements of Medical Information (085851) - Lab Supervisor, 15h (Mar 2022 - May 2022)
        - Final Examination - Software Engineering (085923) - Teaching Assistant, 12h (Feb 2022 - May 2022)

